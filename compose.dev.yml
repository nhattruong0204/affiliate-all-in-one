# Local development only. Production compose lives under infra/ (AAO-092).
name: aao-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aao
      POSTGRES_DB: aao
      # Random per-developer value written to the gitignored .env by `just env`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `just env` first}
    ports:
      # Loopback only: never expose the dev database to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aao -d aao"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
