[workspace]
resolver = "3"
members = ["crates/*"]

# docs/ARCHITECTURE.md §4: nine crates is the V1 ceiling. Adding one needs an ADR.

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "LicenseRef-Proprietary" # placeholder until the owner decides D-4 (entity/licence)

[workspace.dependencies]
# Workspace-internal crates. External dependencies are added per issue, each
# justified in its PR (AGENTS.md §6) and checked by `cargo deny`.
domain = { path = "crates/domain" }
db = { path = "crates/db" }
ledger = { path = "crates/ledger" }
affiliate = { path = "crates/affiliate" }
app = { path = "crates/app" }
ui = { path = "crates/ui" }
testkit = { path = "crates/testkit" }

# External dependencies. One line each, justified in the PR that introduces it (AGENTS.md §6).
# AAO-014 (UI shell): server rendering, HTTP serving, logging.
leptos = { version = "0.8", default-features = false }
fluent-bundle = "0.16"
unic-langid = "0.9"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }
anyhow = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# AGENTS.md §4: no unwrap/expect/panic outside tests and startup wiring
# (clippy.toml allows them inside #[cfg(test)]).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Pedantic lints that are noise for this codebase.
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
