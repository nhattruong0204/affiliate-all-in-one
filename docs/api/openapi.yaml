openapi: 3.1.0
info:
  title: Affiliate All-in-One API
  version: 0.1.0-draft
  description: |
    DRAFT. Core V1 user endpoints. Once the web crate exists, this file is regenerated by utoipa.
    Money is integer VND. Errors are RFC 9457 problem+json.
servers:
  - url: https://example.invalid
security:
  - session: []
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __Host-aaio_session }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, description: "Minor units (VND: dong)" }
        currency: { type: string, enum: [VND] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        trace_id: { type: string }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, code: { type: string } } } }
    Estimate:
      type: object
      description: Always an estimate, never guaranteed.
      required: [is_estimate]
      properties:
        is_estimate: { type: boolean, const: true }
        commission: { $ref: '#/components/schemas/Money' }
        cashback: { $ref: '#/components/schemas/Money' }
        share_bps: { type: integer }
        basis: { type: string, enum: [provider_rate, campaign_default, unknown] }
    AnalyzeRequest:
      type: object
      required: [input]
      properties: { input: { type: string, maxLength: 4096 } }
    AnalyzeResponse:
      type: object
      required: [merchant, eligible]
      properties:
        merchant: { type: string, enum: [shopee_vn, tiktokshop_vn] }
        eligible: { type: boolean }
        ineligible_reason: { type: string }
        product: { type: object, properties: { id: { type: string }, name: { type: string }, image_url: { type: string }, price: { $ref: '#/components/schemas/Money' } } }
        estimate: { $ref: '#/components/schemas/Estimate' }
    Link:
      type: object
      required: [id, go_url, expires_at, status]
      properties:
        id: { type: string, format: uuid }
        go_url: { type: string, format: uri }
        short_url: { type: string, format: uri }
        status: { type: string, enum: [ready, failed, expired] }
        expires_at: { type: string, format: date-time }
        estimate: { $ref: '#/components/schemas/Estimate' }
        purchase_rules: { type: array, items: { type: string } }
    Wallet:
      type: object
      properties:
        pending: { $ref: '#/components/schemas/Money' }
        approved: { $ref: '#/components/schemas/Money' }
        available: { $ref: '#/components/schemas/Money' }
        reserved: { $ref: '#/components/schemas/Money' }
        paid_total: { $ref: '#/components/schemas/Money' }
        owed: { $ref: '#/components/schemas/Money' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant: { type: string }
        product_name: { type: string }
        order_value: { $ref: '#/components/schemas/Money' }
        cashback: { $ref: '#/components/schemas/Money' }
        state: { type: string, enum: [pending, approved, available, reversed, void] }
        ordered_at: { type: string, format: date-time }
        timeline: { type: array, items: { type: object, properties: { state: { type: string }, at: { type: string, format: date-time } } } }
    WithdrawalRequest:
      type: object
      required: [amount, bank_account_id]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        bank_account_id: { type: string, format: uuid }
    Withdrawal:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [requested, reserved, under_review, approved, submitted, processing, paid, rejected, failed, unknown, cancelled] }
        transfer_reference: { type: string }
        created_at: { type: string, format: date-time }
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
paths:
  /api/v1/analyze:
    post:
      security: [ {}, { session: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyzeRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyzeResponse' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/links:
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnalyzeRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Link' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Link' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /api/v1/wallet:
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Wallet' } } } }
  /api/v1/orders:
    get:
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /api/v1/withdrawals:
    post:
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Withdrawal' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: Step-up required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Withdrawal' } }, next_cursor: { type: [string, 'null'] } } } } } }
  /go/{token}:
    get:
      security: [ {} ]
      parameters: [ { name: token, in: path, required: true, schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{20}$' } } ]
      responses:
        '302': { description: Redirect to provider affiliate URL }
        '200': { description: Interstitial for in-app browsers or expired link }
        '404': { description: Unknown token }
  /healthz:
    get: { security: [ {} ], responses: { '200': { description: Process alive } } }
  /readyz:
    get:
      security: [ {} ]
      description: >
        Runs the readiness checks (database reachability today; migrations-current once AAO-004 lands).
        Failing check names are listed in `errors[]` (`field` = check name, `code` = `unavailable`);
        infrastructure details are never returned. Every response carries `X-Trace-Id`.
      responses:
        '200':
          description: Every readiness check passed
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: [ok] }
                  checks: { type: array, items: { type: object, required: [name, status], properties: { name: { type: string }, status: { type: string, enum: [ok] } } } }
        '503':
          description: Not ready (`code` = `not_ready`)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
