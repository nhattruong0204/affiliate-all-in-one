# Minimal V0.1 scrape config (AAO-092). `web` exposes /metrics on its internal listener (:9100),
# reachable only over the `obs` network. Add the worker and exporters when they exist.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: web
    static_configs:
      - targets: ["web:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
