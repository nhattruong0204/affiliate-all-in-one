# TEMPORARY (AAO-014): artifact downloads are blocked from the authoring sandbox, so the
# screenshots are emitted in the job log. Deleted in the next commit.
name: tmp-shots
on:
  push:
    branches: [feat/AAO-014-ui-shell]
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: cargo build --locked -p web
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright test screenshots.spec.ts
        working-directory: e2e
        env:
          CI: "true"
          SCREENSHOTS: "1"
      - name: dump screenshots
        run: |
          ls -l e2e/screenshots
          tar -czf /tmp/shots.tgz -C e2e/screenshots .
          ls -l /tmp/shots.tgz
          echo "---SHOTS-BEGIN---"
          base64 -w 400 /tmp/shots.tgz
          echo "---SHOTS-END---"
