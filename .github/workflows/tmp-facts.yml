name: tmp-facts
# TEMPORARY (AAO-002): removed before the PR is marked ready.
on:
  push:
    branches: [feat/AAO-002-container-build]
    paths: [".github/workflows/tmp-facts.yml"]
permissions:
  contents: read
jobs:
  facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          for tag in nonroot nonroot-amd64; do
            docker buildx imagetools inspect "gcr.io/distroless/cc-debian12:$tag" 2>&1 | sed -n "s/^Digest:/FACT $tag digest:/p" | head -1
          done
          trivy="$(scripts/install-trivy.sh)"
          docker pull -q gcr.io/distroless/cc-debian12:nonroot >/dev/null
          "$trivy" image --no-progress --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed gcr.io/distroless/cc-debian12:nonroot | grep -E "Total|CVE" | sed 's/^/FACT scan /' || true
