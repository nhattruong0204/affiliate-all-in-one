name: tmp-facts
# TEMPORARY (AAO-002): resolves upstream release facts the authoring sandbox cannot read. Removed
# before the PR is marked ready.
on:
  push:
    branches: [feat/AAO-002-container-build]
    paths: [".github/workflows/tmp-facts.yml"]
permissions:
  contents: read
jobs:
  facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -x
          V="$(gh release view --repo aquasecurity/trivy --json tagName -q .tagName)"
          echo "FACT trivy-tag=$V"
          gh release view "$V" --repo aquasecurity/trivy --json publishedAt -q '"FACT trivy-published=" + .publishedAt'
          gh release download "$V" --repo aquasecurity/trivy --pattern '*checksums.txt' --output - | grep -E 'Linux-(64bit|ARM64)\.tar\.gz' | sed 's/^/FACT sum /'
          A="$(gh release view --repo aquasecurity/trivy-action --json tagName -q .tagName)"
          echo "FACT trivy-action-tag=$A"
          gh api "repos/aquasecurity/trivy-action/git/ref/tags/$A" -q '"FACT trivy-action-ref=" + .object.type + " " + .object.sha'
          gh api repos/cargo-bins/cargo-binstall/releases/latest -q .tag_name >/dev/null || true
          docker buildx imagetools inspect gcr.io/distroless/cc-debian12:nonroot 2>&1 | sed -n 's/^Digest:/FACT distroless-digest:/p;s/^Name:/FACT name:/p' | head -4
          docker buildx imagetools inspect rust:1.97.0-bookworm 2>&1 | sed -n 's/^Digest:/FACT rust-digest:/p' | head -2
