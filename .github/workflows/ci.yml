name: CI

# Required status checks for branch protection (D-12): lint, test, supply-chain, secrets.
# e2e (Playwright + axe + strict CSP) and lighthouse (mobile Perf >= 90, A11y >= 95) arrive with
# AAO-014; add them to the required list once they have been stable for a few PRs.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories are noticed even when nobody is pushing.
    - cron: "17 2 * * 1"
  workflow_dispatch:

# Read-only by default; no job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0
      - run: just fmt-check
      - run: just clippy
      - name: Architecture guard-rails (dependency direction, no string-built SQL, self-tests)
        run: just arch-checks
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/tests/*.sh
      - name: Generated CSS is up to date (Tailwind standalone CLI, checksum-pinned)
        run: just css-check

  test:
    name: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-nextest@0.9.152
      - name: nextest, doctests, sqlx offline metadata
        run: just test

  e2e:
    name: e2e
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0
      - name: Build the server once so Playwright starts it instantly
        run: cargo build --locked -p web
      - name: Install e2e dependencies (lockfile only, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: e2e
      - name: Playwright + axe against the real server (system Chrome), with PR screenshots
        run: just e2e
        env:
          CI: "true"
          SCREENSHOTS: "1"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: lighthouse
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Release build (what production serves)
        run: cargo build --release --locked -p web
      - name: Install e2e dependencies (lockfile only, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: e2e
      - name: Lighthouse mobile, median of 3 (Performance >= 90, Accessibility >= 95)
        run: node lighthouse-check.mjs
        working-directory: e2e
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: e2e/.lighthouse/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the web and worker images, checks the acceptance criteria (size, UID 10001, no shell,
  # /healthz), and gates on Trivy: fixable HIGH/CRITICAL findings in OS packages or in the Rust
  # dependency set embedded by cargo-auditable fail the build. Image signing (cosign) and SBOM
  # publication move to the V1.0 gate (AAO-090).
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # renovate: datasource=crate depName=cargo-chef
      CARGO_CHEF_VERSION: "0.1.78"
      # renovate: datasource=crate depName=cargo-auditable
      CARGO_AUDITABLE_VERSION: "0.7.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfile Rust version matches rust-toolchain.toml
        run: |
          docker_v="$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile)"
          toolchain_v="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "Dockerfile=${docker_v} rust-toolchain.toml=${toolchain_v}"
          test -n "$docker_v" && test "$docker_v" = "$toolchain_v"
      - name: Build web and worker images
        run: |
          epoch="$(git log -1 --pretty=%ct)"
          for target in worker web; do
            docker buildx build --load --target "$target" \
              --build-arg "CARGO_CHEF_VERSION=${CARGO_CHEF_VERSION}" \
              --build-arg "CARGO_AUDITABLE_VERSION=${CARGO_AUDITABLE_VERSION}" \
              --build-arg "SOURCE_DATE_EPOCH=${epoch}" \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              --tag "aao-${target}:ci" .
          done
      - name: Image smoke (size, UID 10001, no shell, /healthz, /readyz)
        run: scripts/image-smoke.sh aao-web:ci aao-worker:ci
      - name: Production stack smoke (compose up from scratch; headers, limits, metrics, backup)
        run: scripts/stack-smoke.sh aao-web:ci
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        run: |
          trivy="$(scripts/install-trivy.sh)"
          for image in aao-web:ci aao-worker:ci; do
            "$trivy" image --no-progress --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile .trivyignore.yaml "$image"
          done

  infra:
    name: infra
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck infra/up.sh infra/bootstrap/*.sh infra/backup/*.sh scripts/check-infra.sh scripts/stack-smoke.sh
      - name: Compose policy (read-only rootfs, capabilities, ports, secrets, tags)
        run: scripts/check-infra.sh
      - name: Caddyfile, Prometheus config, alert rules and their unit tests
        run: |
          infra/bootstrap/gen-secrets.sh "$RUNNER_TEMP/secrets" >/dev/null
          export AAO_SECRETS_DIR="$RUNNER_TEMP/secrets" WEB_IMAGE=registry.invalid/aao-web:test \
                 SITE_ADDRESS=example.invalid ACME_EMAIL=ops@example.invalid
          rendered="$(docker compose -f infra/compose.prod.yml config --format json)"
          caddy_image="$(jq -r .services.caddy.image <<<"$rendered")"
          prom_image="$(jq -r .services.prometheus.image <<<"$rendered")"
          docker run --rm -e SITE_ADDRESS -e ACME_EMAIL \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy_image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          promtool() { docker run --rm --entrypoint promtool -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" "$prom_image" "$@"; }
          promtool check config /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/alerts.yml
          promtool test rules /etc/prometheus/alerts_test.yml
      - name: Grafana provisioning files are valid JSON/YAML
        run: |
          jq empty infra/observability/grafana/dashboards/*.json
          python3 -c "import sys,yaml;[yaml.safe_load(open(f)) for f in sys.argv[1:]]" \
            infra/observability/grafana/provisioning/*/*.yml

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-deny@0.20.2,cargo-audit@0.23.0
      - name: cargo deny (licences, bans, sources, advisories)
        run: just deny
      - name: cargo audit
        run: just audit

  secrets:
    name: secrets
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, matching the release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan history, not just the tip
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and working tree (findings are redacted in logs)
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .
