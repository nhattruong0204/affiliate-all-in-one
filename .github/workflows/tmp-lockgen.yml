# TEMPORARY (AAO-014): sandbox has no crates.io access, so CI compiles the new crates, runs their
# tests and prints Cargo.lock for committing. Deleted before the PR is marked ready.
name: tmp-lockgen
on:
  push:
    branches: [feat/AAO-014-ui-shell]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update && rustup show active-toolchain
      - name: check (unlocked, resolves new dependencies)
        id: check
        continue-on-error: true
        run: cargo check --workspace --all-targets 2>&1 | tail -150
      - name: test ui + web
        continue-on-error: true
        run: cargo test -p ui -p web 2>&1 | tail -200
      - name: dump Cargo.lock
        if: always()
        run: |
          echo "---LOCK-BEGIN---"
          gzip -9 -c Cargo.lock | base64 -w 200
          echo "---LOCK-END---"
