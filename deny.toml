# cargo-deny policy. Changes need owner review (CODEOWNERS): this file is a supply-chain control.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []   # every exception needs an ID, a reason and an expiry date in a comment

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]

[licenses.private]
ignore = true   # our own crates are `publish = false`

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # path dependencies between workspace crates
deny = [
  # docs/TECH_STACK.md: rustls only, no OpenSSL.
  { crate = "openssl", reason = "TLS is rustls only (TECH_STACK.md)" },
  { crate = "openssl-sys", reason = "TLS is rustls only (TECH_STACK.md)" },
  { crate = "native-tls", reason = "TLS is rustls only (TECH_STACK.md)" },
  # Floats must never carry money (AGENTS.md §5); decimal crates need an ADR first.
  { crate = "rust_decimal", reason = "money is i64 VND; needs an ADR before use" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
