# cargo-deny policy. Changes need owner review (CODEOWNERS): this file is a supply-chain control.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every exception needs an ID, a reason and an expiry date in a comment.
ignore = [
  # `paste` (proc-macro, compile time only) is archived upstream. It is pulled in by every Leptos
  # 0.8 release (leptos, tachys, reactive_graph, either_of); there is no safe upgrade and no
  # runtime code from it ships. Added in AAO-014 (owner decision: adopting Leptos, ADR-0003).
  # Re-check by 2027-02-18: drop this entry once Leptos moves to `pastey` or removes it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro crate required by Leptos 0.8" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  # Added in AAO-014 for the Leptos dependency tree; both are permissive:
  "CC0-1.0",  # base16 (via leptos -> wasm_split_macros): public-domain dedication
  "BSL-1.0",  # xxhash-rust (via leptos -> server_fn): Boost licence, MIT-like
]

[licenses.private]
ignore = true   # our own crates are `publish = false`

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # path dependencies between workspace crates
deny = [
  # docs/TECH_STACK.md: rustls only, no OpenSSL.
  { crate = "openssl", reason = "TLS is rustls only (TECH_STACK.md)" },
  { crate = "openssl-sys", reason = "TLS is rustls only (TECH_STACK.md)" },
  { crate = "native-tls", reason = "TLS is rustls only (TECH_STACK.md)" },
  # Floats must never carry money (AGENTS.md §5); decimal crates need an ADR first.
  { crate = "rust_decimal", reason = "money is i64 VND; needs an ADR before use" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
